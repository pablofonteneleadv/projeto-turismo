<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel · Passeios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
.adm{padding-block:16px 80px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:57px;z-index:5;background:var(--bg);padding-top:6px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:1.6rem}
.kpi span{font-size:.85rem;color:var(--muted)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item-head h3{font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .btn{padding:8px 12px;font-size:.9rem}
.st{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.05em}
.st-pendente{background:var(--sol-soft);color:#8A5A00}.st-pago,.st-confirmado{background:var(--bom-soft);color:var(--bom)}.st-realizado{background:var(--mar-soft);color:var(--mar)}.st-cancelado{background:var(--ruim-soft);color:var(--ruim)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.formgrid .full{grid-column:1 / -1}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check input{width:18px;height:18px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{width:110px;display:flex;flex-direction:column;gap:4px}
.thumbs img{width:110px;height:74px;object-fit:cover;border-radius:8px;background:var(--mar-soft)}
.thumbs button{font-size:.75rem;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.login{max-width:420px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.warn{background:var(--sol-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.small{font-size:.85rem}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="./"><b data-brand>Maré Tur</b><small>Painel de gestão</small></a>
  <a class="btn btn-ghost" href="./" target="_blank" rel="noopener">Ver site</a>
  <button class="btn btn-ghost" type="button" id="logout" hidden>Sair</button>
</div></header>
<main class="wrap" id="app"><div class="empty" style="margin-top:24px">Carregando…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
